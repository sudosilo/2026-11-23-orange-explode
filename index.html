<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Explode</title>
<style>
  :root { --bg:#f6f4ef; --ink:#222; --soft:#8a857b; --line:#d9d4c8; --accent:#e8692c; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui, sans-serif; }
  body { padding-bottom:150px; }
  header { padding:14px 16px 6px; }
  h1 { margin:0; font-size:22px; letter-spacing:1px; }
  #status { color:var(--soft); font-size:14px; margin-top:4px; min-height:18px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:8px 16px; }
  button, label.btn, select { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:15px; color:var(--ink); font-family:inherit; }
  button:disabled { opacity:.45; }
  label.btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  input[type=file] { display:none; }
  .slider { display:flex; align-items:center; gap:10px; padding:4px 16px 10px; font-size:14px; color:var(--soft); }
  .slider input { flex:1; accent-color:var(--accent); }
  .slider select { padding:8px 10px; font-size:14px; }
  #wrap { padding:40px 16px 20px; perspective:900px; }
  #stage { position:relative; margin:0 auto; touch-action:none; transform-style:preserve-3d; }
  #base { display:block; width:100%; height:100%; border-radius:6px; box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .piece { position:absolute; touch-action:none; transition:transform .25s ease-out, filter .25s ease-out; will-change:transform; transform-style:preserve-3d; }
  .piece.drag { transition:none; }
  .piece > canvas { width:100%; height:100%; display:block; pointer-events:none; }
  .callout { position:absolute; left:50%; top:50%; width:0; height:0; pointer-events:none; z-index:999; }
  .callout svg { position:absolute; left:0; top:0; overflow:visible; width:1px; height:1px; }
  .callout line { stroke:#222; stroke-width:1.5; transition:stroke-dashoffset .35s ease-out; }
  .callout circle { fill:var(--accent); opacity:0; transition:opacity .15s; }
  .callout .label { position:absolute; background:#fff; color:#222; border:1.5px solid #222; padding:4px 8px; font-size:12px; line-height:1.25; letter-spacing:1.5px; text-transform:uppercase; font-weight:600; white-space:pre-wrap; width:max-content; max-width:180px; opacity:0; transition:opacity .25s ease-out; }
  .callout.show circle { opacity:1; }
  .callout.show .label { opacity:1; transition-delay:.3s; }
  .piece.editing > canvas { outline:2px dashed var(--accent); outline-offset:2px; }
  .ping { position:absolute; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%; border:3px solid var(--accent); pointer-events:none; animation:ping .9s ease-out forwards; z-index:2000; }
  @keyframes ping { to { transform:scale(2.4); opacity:0; } }
  #empty { text-align:center; color:var(--soft); padding:60px 20px; font-size:15px; }
  #tabs { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; padding:10px 16px 14px; background:#fff; border-top:1px solid var(--line); z-index:3000; }
  #tabs button { flex:1; }
  #tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #editor { position:fixed; left:0; right:0; bottom:66px; background:#fff; border-top:1px solid var(--line); padding:10px 16px; z-index:3000; display:flex; flex-direction:column; gap:8px; }
  #editor[hidden] { display:none; }
  #editor textarea { width:100%; min-height:60px; border:1px solid var(--line); border-radius:10px; padding:8px; font-size:15px; font-family:inherit; background:var(--bg); color:var(--ink); }
  #editor .row { display:flex; gap:8px; }
  #editor .row button { flex:1; }
</style>
</head>
<body>
<header>
  <h1>EXPLODE</h1>
  <div id="status">Loading model...</div>
</header>
<div class="bar">
  <label class="btn primary">Photo<input id="file" type="file" accept="image/*"></label>
  <button id="undo" disabled>Undo</button>
  <button id="clear" disabled>Reset</button>
  <button id="holes">Holes on</button>
  <button id="bubbles">Bubbles on</button>
</div>
<div class="slider">Explode <input id="explode" type="range" min="0" max="100" value="40">
  <select id="mode"><option value="all">All at once</option><option value="seq">One by one</option></select>
  <select id="dir"><option value="out">Spread out</option><option value="toward">Toward you</option><option value="away">Away from you</option></select></div>
<div id="wrap">
  <div id="empty">Pick a photo, then tap anything in it.</div>
  <div id="stage" hidden><canvas id="base"></canvas></div>
</div>
<div id="editor" hidden>
  <textarea id="text" placeholder="Bubble text"></textarea>
  <div class="row"><button id="save">Save</button><button id="remove">Remove</button><button id="close">Close</button></div>
</div>
<div id="tabs"><button id="tabCut" class="on">Cut</button><button id="tabBubble">Bubble</button></div>

<script type="module">
import { SamModel, AutoProcessor, RawImage, Tensor, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';
env.allowLocalModels = false;

const MODEL = 'Xenova/slimsam-77-uniform';
const MAX = 1024;
const $ = id => document.getElementById(id);
const statusEl = $('status'), stage = $('stage'), baseCanvas = $('base');
const say = t => { statusEl.textContent = t; };
const tick = () => new Promise(r => setTimeout(r, 30));

let model, processor, root = null;
let pieces = [], busy = false, showHoles = true, showBubbles = true, tool = 'cut', editing = null;

async function load() {
  try {
    [model, processor] = await Promise.all([
      SamModel.from_pretrained(MODEL, { progress_callback: p => { if (p.status === 'progress' && p.file.endsWith('.onnx')) say('Loading model ' + Math.round(p.progress) + '%'); } }),
      AutoProcessor.from_pretrained(MODEL)
    ]);
    say('Ready. Pick a photo.');
    if (root) { busy = true; await embed(root); busy = false; say('Tap anything to cut it out.'); }
  } catch (e) { say('Model failed to load: ' + e.message); }
}

$('file').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  const img = await createImageBitmap(f);
  const s = Math.min(1, MAX / Math.max(img.width, img.height));
  const W = Math.round(img.width * s), H = Math.round(img.height * s);
  const src = document.createElement('canvas');
  src.width = W; src.height = H;
  src.getContext('2d').drawImage(img, 0, 0, W, H);
  baseCanvas.width = W; baseCanvas.height = H;
  pieces.forEach(p => p.el.remove());
  pieces = [];
  closeEditor();
  root = { isRoot: true, src, w: W, h: H, el: stage, canvas: baseCanvas, children: [], emb: null };
  $('empty').hidden = true;
  stage.hidden = false;
  fit();
  redraw(root);
  buttons();
  e.target.value = '';
  if (model) { busy = true; say('Studying the photo...'); await tick(); await embed(root); busy = false; say('Tap anything to cut it out.'); }
};

async function embed(layer) {
  if (layer.emb) return layer.emb;
  const tmp = document.createElement('canvas');
  tmp.width = layer.w; tmp.height = layer.h;
  const c = tmp.getContext('2d');
  c.fillStyle = '#ffffff';
  c.fillRect(0, 0, layer.w, layer.h);
  c.drawImage(layer.src, 0, 0);
  const blob = await new Promise(r => tmp.toBlob(r, 'image/png'));
  const raw = await RawImage.fromBlob(blob);
  const inputs = await processor(raw);
  const embeddings = await model.get_image_embeddings(inputs);
  layer.emb = { inputs, embeddings };
  return layer.emb;
}

function fit() {
  const maxW = Math.min(window.innerWidth - 32, 900);
  const maxH = window.innerHeight * 0.6;
  const s = Math.min(maxW / root.w, maxH / root.h);
  stage.style.width = (root.w * s) + 'px';
  stage.style.height = (root.h * s) + 'px';
  layout();
}
window.addEventListener('resize', () => { if (root) fit(); });

function redraw(layer) {
  const c = layer.canvas.getContext('2d');
  c.clearRect(0, 0, layer.w, layer.h);
  c.drawImage(layer.src, 0, 0);
  if (showHoles) for (const ch of layer.children) c.drawImage(ch.hole, ch.x, ch.y);
}
function redrawAll() { if (!root) return; redraw(root); pieces.forEach(redraw); }

function alphaAt(p, nx, ny) {
  const x = Math.min(p.w - 1, Math.max(0, Math.floor(nx * p.w)));
  const y = Math.min(p.h - 1, Math.max(0, Math.floor(ny * p.h)));
  return p.alpha[y * p.w + x];
}

function hit(cx, cy) {
  for (const el of document.elementsFromPoint(cx, cy)) {
    if (el === baseCanvas) {
      const r = baseCanvas.getBoundingClientRect();
      return { layer: root, nx: (cx - r.left) / r.width, ny: (cy - r.top) / r.height };
    }
    if (el.classList && el.classList.contains('piece')) {
      const p = pieces.find(q => q.el === el);
      if (!p) continue;
      const r = el.getBoundingClientRect();
      const nx = (cx - r.left) / r.width, ny = (cy - r.top) / r.height;
      if (alphaAt(p, nx, ny) > 0) return { layer: p, nx, ny };
    }
  }
  return null;
}

let press = null;
stage.addEventListener('pointerdown', e => {
  if (!root) return;
  const h = hit(e.clientX, e.clientY);
  if (!h) return;
  e.preventDefault();
  stage.setPointerCapture(e.pointerId);
  press = { h, sx: e.clientX, sy: e.clientY, moved: false };
  if (!h.layer.isRoot) { press.dx = h.layer.dx; press.dy = h.layer.dy; }
});
stage.addEventListener('pointermove', e => {
  if (!press) return;
  const mx = e.clientX - press.sx, my = e.clientY - press.sy;
  if (!press.moved && Math.hypot(mx, my) > 8) press.moved = true;
  if (press.moved && !press.h.layer.isRoot) {
    const p = press.h.layer;
    p.el.classList.add('drag');
    p.dx = press.dx + mx; p.dy = press.dy + my;
    layout();
  }
});
const release = async e => {
  if (!press) return;
  const pr = press; press = null;
  if (!pr.h.layer.isRoot) pr.h.layer.el.classList.remove('drag');
  if (pr.moved || e.type === 'pointercancel') return;
  const { layer, nx, ny } = pr.h;
  if (tool === 'bubble') { if (!layer.isRoot) openEditor(layer); else say('Tap a cut piece to give it a bubble.'); return; }
  await tapCut(layer, nx, ny, e.clientX, e.clientY);
};
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', release);

async function tapCut(layer, nx, ny, cx, cy) {
  if (busy) return;
  if (!model) { say('Model still loading...'); return; }
  const sr = stage.getBoundingClientRect();
  const ping = document.createElement('div');
  ping.className = 'ping';
  ping.style.left = (cx - sr.left) + 'px'; ping.style.top = (cy - sr.top) + 'px';
  stage.appendChild(ping);
  setTimeout(() => ping.remove(), 900);
  busy = true;
  try {
    if (!layer.emb) { say(layer.isRoot ? 'Studying the photo...' : 'Studying this piece for a deeper cut...'); await tick(); await embed(layer); }
    say('Cutting...'); await tick();
    await cut(layer, nx, ny);
  } catch (err) { say('Cut failed: ' + err.message); }
  busy = false;
}

async function cut(layer, nx, ny) {
  const { inputs, embeddings } = layer.emb;
  const W = layer.w, H = layer.h;
  const rs = inputs.reshaped_input_sizes[0];
  const input_points = new Tensor('float32', [nx * rs[1], ny * rs[0]], [1, 1, 1, 2]);
  const input_labels = new Tensor('int64', [1n], [1, 1, 1]);
  const out = await model({ ...embeddings, input_points, input_labels });
  const masks = await processor.post_process_masks(out.pred_masks, inputs.original_sizes, inputs.reshaped_input_sizes);
  const scores = out.iou_scores.data;
  const order = [...scores.keys()].sort((a, b) => scores[b] - scores[a]);
  const m = masks[0].data;
  const inside = (off, i) => m[off + i] && (layer.isRoot || layer.alpha[i] > 0);

  let pick = -1, box;
  for (const idx of order) {
    const off = idx * W * H;
    let x0 = W, y0 = H, x1 = -1, y1 = -1, count = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (inside(off, y * W + x)) { count++; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    const total = layer.isRoot ? W * H : layer.solid;
    if (count > 0 && (layer.isRoot || count < total * 0.92)) { pick = idx; box = { x0, y0, x1, y1 }; break; }
  }
  if (pick < 0) { say(layer.isRoot ? 'Nothing found there. Tap again.' : 'Could not split that piece further there. Try another spot.'); return; }
  const off = pick * W * H;
  const { x0, y0, x1, y1 } = box;
  const w = x1 - x0 + 1, h = y1 - y0 + 1;

  const src = layer.src.getContext('2d').getImageData(x0, y0, w, h);
  const alpha = new Uint8Array(w * h);
  let solid = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x);
    if (!inside(off, (y + y0) * W + (x + x0))) src.data[i * 4 + 3] = 0;
    alpha[i] = src.data[i * 4 + 3];
    if (alpha[i]) solid++;
  }
  const srcCanvas = document.createElement('canvas');
  srcCanvas.width = w; srcCanvas.height = h;
  srcCanvas.getContext('2d').putImageData(src, 0, 0);

  const hole = document.createElement('canvas');
  hole.width = w; hole.height = h;
  const hc = hole.getContext('2d');
  hc.drawImage(srcCanvas, 0, 0);
  hc.globalCompositeOperation = 'source-in';
  hc.fillStyle = '#e4e0d6';
  hc.fillRect(0, 0, w, h);

  const el = document.createElement('div');
  el.className = 'piece';
  el.style.left = (x0 / W * 100) + '%';
  el.style.top = (y0 / H * 100) + '%';
  el.style.width = (w / W * 100) + '%';
  el.style.height = (h / H * 100) + '%';
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  el.appendChild(cv);
  const bubble = document.createElement('div');
  bubble.className = 'callout';
  bubble.innerHTML = '<svg><line x1="0" y1="0"/><circle cx="0" cy="0" r="3.5"/></svg><div class="label"></div>';
  el.appendChild(bubble);
  layer.el.appendChild(el);

  const depth = layer.isRoot ? 1 : layer.depth + 1;
  const p = { src: srcCanvas, canvas: cv, hole, alpha, solid, w, h, x: x0, y: y0, cx: (x0 + w / 2) / W, cy: (y0 + h / 2) / H, dx: 0, dy: 0, el, bubble, text: '', parent: layer, children: [], emb: null, depth, n: layer.children.length + 1 };
  layer.children.push(p);
  pieces.push(p);
  redraw(p);
  redraw(layer);
  layout();
  buttons();
  say(pieces.length + ' piece' + (pieces.length > 1 ? 's' : '') + (depth > 1 ? ', level ' + depth + ' cut.' : '.') + ' Tap a piece to cut deeper.');
}

function layout() {
  const K = $('explode').value / 100;
  const seq = $('mode').value === 'seq';
  const n = pieces.length;
  const span = n > 1 ? 0.6 / (n - 1) : 0;
  pieces.forEach((p, i) => {
    const k = seq && n > 1 ? Math.min(1, Math.max(0, (K - i * span) / 0.4)) : K;
    const pw = p.parent.el.clientWidth, ph = p.parent.el.clientHeight;
    const reach = p.depth === 1 ? 0.8 : 1.1;
    const dir = $('dir').value;
    const spread = dir === 'out' ? 1 : 0;
    const ox = (p.cx - 0.5) * pw * reach * k * spread + p.dx;
    const oy = (p.cy - 0.5) * ph * reach * k * spread + p.dy;
    const z = dir === 'out' ? (20 + p.n * 18) * k + 6 : 6 + p.n;
    const sc = dir === 'toward' ? 1 + 1.2 * k : dir === 'away' ? 1 - 0.6 * k : 1;
    p.el.style.transform = `translate3d(${ox}px, ${oy}px, ${z}px) scale(${sc})`;
    p.el.style.filter = `drop-shadow(0 ${4 + 14 * k}px ${6 + 12 * k}px rgba(0,0,0,${0.18 + 0.15 * k}))`;
    p.el.style.zIndex = 10 + p.n;
    const show = !!p.text && (editing === p || (showBubbles && k >= 0.97));
    callout(p, show);
  });
}
function callout(p, show) {
  const top = topOf(p);
  let vx = top.cx - 0.5, vy = top.cy - 0.5;
  const d = Math.hypot(vx, vy) || 1;
  vx /= d; vy /= d;
  if (Math.abs(vx) < 0.2 && Math.abs(vy) < 0.2) { vx = 0.7; vy = -0.7; }
  const L = 70 + p.depth * 20;
  const ex = vx * L, ey = vy * L;
  const line = p.bubble.querySelector('line');
  line.setAttribute('x2', ex); line.setAttribute('y2', ey);
  line.style.strokeDasharray = L;
  line.style.strokeDashoffset = show ? 0 : L;
  const lab = p.bubble.querySelector('.label');
  lab.textContent = p.text;
  lab.style.left = ex + 'px'; lab.style.top = ey + 'px';
  lab.style.transform = `translate(${vx >= 0 ? '4px' : 'calc(-100% - 4px)'}, -50%)`;
  p.bubble.classList.toggle('show', show);
}
function topOf(p) { while (!p.parent.isRoot) p = p.parent; return p; }
$('explode').oninput = layout;
$('mode').onchange = layout;
$('dir').onchange = layout;

function openEditor(p) {
  if (editing) editing.el.classList.remove('editing');
  editing = p;
  p.el.classList.add('editing');
  $('text').value = p.text;
  $('editor').hidden = false;
  $('text').focus();
  layout();
}
function closeEditor() {
  if (editing) editing.el.classList.remove('editing');
  editing = null;
  $('editor').hidden = true;
  layout();
}
$('save').onclick = () => { if (editing) { editing.text = $('text').value.trim(); layout(); } closeEditor(); };
$('remove').onclick = () => { if (editing) { editing.text = ''; layout(); } closeEditor(); };
$('close').onclick = closeEditor;

function setTool(t) {
  tool = t;
  $('tabCut').classList.toggle('on', t === 'cut');
  $('tabBubble').classList.toggle('on', t === 'bubble');
  if (t === 'cut') closeEditor();
  say(t === 'cut' ? 'Cut: tap the photo or tap a piece to cut deeper.' : 'Bubble: tap a cut piece to write its label. Labels show while you slide forward.');
  layout();
}
$('tabCut').onclick = () => setTool('cut');
$('tabBubble').onclick = () => setTool('bubble');

function buttons() {
  $('undo').disabled = !pieces.length;
  $('clear').disabled = !pieces.length;
}
$('undo').onclick = () => {
  const p = pieces.pop();
  if (!p) return;
  if (editing === p) closeEditor();
  p.el.remove();
  p.parent.children = p.parent.children.filter(c => c !== p);
  redraw(p.parent);
  layout();
  buttons();
};
$('clear').onclick = () => {
  closeEditor();
  pieces.forEach(p => p.el.remove());
  pieces = [];
  root.children = [];
  redraw(root);
  buttons();
  say('Tap anything to cut it out.');
};
$('holes').onclick = () => { showHoles = !showHoles; $('holes').textContent = showHoles ? 'Holes on' : 'Holes off'; redrawAll(); };
$('bubbles').onclick = () => { showBubbles = !showBubbles; $('bubbles').textContent = showBubbles ? 'Bubbles on' : 'Bubbles off'; layout(); };

load();
</script>
</body>
</html>
