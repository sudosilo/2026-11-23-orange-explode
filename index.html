<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Explode</title>
<style>
  :root { --bg:#f6f4ef; --ink:#222; --soft:#8a857b; --line:#d9d4c8; --accent:#e8692c; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui, sans-serif; }
  header { padding:14px 16px 6px; }
  h1 { margin:0; font-size:22px; letter-spacing:1px; }
  #status { color:var(--soft); font-size:14px; margin-top:4px; min-height:18px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:8px 16px; }
  button, label.btn { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:15px; color:var(--ink); }
  button:disabled { opacity:.45; }
  label.btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  input[type=file] { display:none; }
  .slider { display:flex; align-items:center; gap:10px; padding:4px 16px 10px; font-size:14px; color:var(--soft); }
  .slider input { flex:1; accent-color:var(--accent); }
  .slider select { background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:14px; color:var(--ink); }
  #wrap { padding:20px 16px 60px; perspective:900px; }
  #stage { position:relative; margin:0 auto; touch-action:none; transform-style:preserve-3d; }
  #base { display:block; width:100%; height:100%; border-radius:6px; box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .piece { position:absolute; touch-action:none; transition:transform .25s ease-out, filter .25s ease-out; will-change:transform; }
  .piece.drag { transition:none; }
  .piece canvas { width:100%; height:100%; display:block; pointer-events:none; }
  .ping { position:absolute; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%; border:3px solid var(--accent); pointer-events:none; animation:ping .9s ease-out forwards; }
  @keyframes ping { to { transform:scale(2.4); opacity:0; } }
  #empty { text-align:center; color:var(--soft); padding:60px 20px; font-size:15px; }
</style>
</head>
<body>
<header>
  <h1>EXPLODE</h1>
  <div id="status">Loading model...</div>
</header>
<div class="bar">
  <label class="btn primary">Photo<input id="file" type="file" accept="image/*"></label>
  <button id="undo" disabled>Undo</button>
  <button id="clear" disabled>Reset</button>
  <button id="holes">Holes on</button>
</div>
<div class="slider">Explode <input id="explode" type="range" min="0" max="100" value="40">
  <select id="mode"><option value="all">All at once</option><option value="seq">One by one</option></select></div>
<div id="wrap">
  <div id="empty">Pick a photo, then tap anything in it.</div>
  <div id="stage" hidden><canvas id="base"></canvas></div>
</div>

<script type="module">
import { SamModel, AutoProcessor, RawImage, Tensor, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';
env.allowLocalModels = false;

const MODEL = 'Xenova/slimsam-77-uniform';
const MAX = 1024;
const $ = id => document.getElementById(id);
const statusEl = $('status'), stage = $('stage'), base = $('base');
const say = t => { statusEl.textContent = t; };
const tick = () => new Promise(r => setTimeout(r, 30));

let model, processor, inputs, embeddings, original, W = 0, H = 0;
let pieces = [], busy = false, showHoles = true, dragging = null;

async function load() {
  try {
    [model, processor] = await Promise.all([
      SamModel.from_pretrained(MODEL, { progress_callback: p => { if (p.status === 'progress' && p.file.endsWith('.onnx')) say('Loading model ' + Math.round(p.progress) + '%'); } }),
      AutoProcessor.from_pretrained(MODEL)
    ]);
    say('Ready. Pick a photo.');
    if (original) await embed();
  } catch (e) { say('Model failed to load: ' + e.message); }
}

$('file').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  const img = await createImageBitmap(f);
  const s = Math.min(1, MAX / Math.max(img.width, img.height));
  W = Math.round(img.width * s); H = Math.round(img.height * s);
  original = document.createElement('canvas');
  original.width = W; original.height = H;
  original.getContext('2d').drawImage(img, 0, 0, W, H);
  base.width = W; base.height = H;
  pieces.forEach(p => p.el.remove());
  pieces = [];
  $('empty').hidden = true;
  stage.hidden = false;
  fit();
  redrawBase();
  buttons();
  e.target.value = '';
  if (model) await embed();
};

async function embed() {
  busy = true; embeddings = null;
  say('Studying the photo...');
  await tick();
  const blob = await new Promise(r => original.toBlob(r, 'image/png'));
  const raw = await RawImage.fromBlob(blob);
  inputs = await processor(raw);
  embeddings = await model.get_image_embeddings(inputs);
  busy = false;
  say('Tap anything to cut it out.');
}

function fit() {
  const maxW = Math.min(window.innerWidth - 32, 900);
  const maxH = window.innerHeight * 0.68;
  const s = Math.min(maxW / W, maxH / H);
  stage.style.width = (W * s) + 'px';
  stage.style.height = (H * s) + 'px';
  layout();
}
window.addEventListener('resize', () => { if (W) fit(); });

function redrawBase() {
  const c = base.getContext('2d');
  c.clearRect(0, 0, W, H);
  c.drawImage(original, 0, 0);
  if (showHoles) for (const p of pieces) c.drawImage(p.hole, p.x, p.y);
}

stage.addEventListener('pointerdown', async e => {
  if (e.target.closest('.piece')) return;
  if (busy || !embeddings) { if (!model) say('Model still loading...'); return; }
  const r = stage.getBoundingClientRect();
  const nx = (e.clientX - r.left) / r.width, ny = (e.clientY - r.top) / r.height;
  const ping = document.createElement('div');
  ping.className = 'ping';
  ping.style.left = (nx * 100) + '%'; ping.style.top = (ny * 100) + '%';
  stage.appendChild(ping);
  setTimeout(() => ping.remove(), 900);
  busy = true; say('Cutting...');
  await tick();
  try { await cut(nx, ny); } catch (err) { say('Cut failed: ' + err.message); }
  busy = false;
});

async function cut(nx, ny) {
  const rs = inputs.reshaped_input_sizes[0];
  const input_points = new Tensor('float32', [nx * rs[1], ny * rs[0]], [1, 1, 1, 2]);
  const input_labels = new Tensor('int64', [1n], [1, 1, 1]);
  const out = await model({ ...embeddings, input_points, input_labels });
  const masks = await processor.post_process_masks(out.pred_masks, inputs.original_sizes, inputs.reshaped_input_sizes);
  const scores = out.iou_scores.data;
  let best = 0;
  for (let i = 1; i < scores.length; i++) if (scores[i] > scores[best]) best = i;
  const m = masks[0].data, off = best * W * H;

  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (m[off + y * W + x]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) { say('Nothing found there. Tap again.'); return; }
  const w = x1 - x0 + 1, h = y1 - y0 + 1;

  const src = original.getContext('2d').getImageData(x0, y0, w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (!m[off + (y + y0) * W + (x + x0)]) src.data[(y * w + x) * 4 + 3] = 0;
  }
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  cv.getContext('2d').putImageData(src, 0, 0);

  const hole = document.createElement('canvas');
  hole.width = w; hole.height = h;
  const hc = hole.getContext('2d');
  hc.drawImage(cv, 0, 0);
  hc.globalCompositeOperation = 'source-in';
  hc.fillStyle = '#e4e0d6';
  hc.fillRect(0, 0, w, h);

  const el = document.createElement('div');
  el.className = 'piece';
  el.style.left = (x0 / W * 100) + '%';
  el.style.top = (y0 / H * 100) + '%';
  el.style.width = (w / W * 100) + '%';
  el.style.height = (h / H * 100) + '%';
  el.appendChild(cv);
  stage.appendChild(el);

  const p = { el, hole, x: x0, y: y0, cx: (x0 + w / 2) / W, cy: (y0 + h / 2) / H, dx: 0, dy: 0, n: pieces.length + 1 };
  pieces.push(p);
  hookDrag(p);
  redrawBase();
  layout();
  buttons();
  say(pieces.length + ' piece' + (pieces.length > 1 ? 's' : '') + '. Tap more, drag pieces, slide to explode.');
}

function layout() {
  const K = $('explode').value / 100;
  const seq = $('mode').value === 'seq';
  const n = pieces.length;
  const span = n > 1 ? 0.6 / (n - 1) : 0;
  const sw = stage.clientWidth, sh = stage.clientHeight;
  for (const [i, p] of pieces.entries()) {
    const k = seq && n > 1 ? Math.min(1, Math.max(0, (K - i * span) / 0.4)) : K;
    const ox = (p.cx - 0.5) * sw * 0.8 * k + p.dx;
    const oy = (p.cy - 0.5) * sh * 0.8 * k + p.dy;
    const z = (20 + p.n * 18) * k + 6;
    p.el.style.transform = `translate3d(${ox}px, ${oy}px, ${z}px)`;
    p.el.style.filter = `drop-shadow(0 ${4 + 14 * k}px ${6 + 12 * k}px rgba(0,0,0,${0.18 + 0.15 * k}))`;
    p.el.style.zIndex = 10 + p.n;
  }
}
$('explode').oninput = layout;
$('mode').onchange = layout;

function hookDrag(p) {
  p.el.addEventListener('pointerdown', e => {
    e.preventDefault();
    p.el.setPointerCapture(e.pointerId);
    p.el.classList.add('drag');
    dragging = { p, sx: e.clientX, sy: e.clientY, dx: p.dx, dy: p.dy };
  });
  p.el.addEventListener('pointermove', e => {
    if (!dragging || dragging.p !== p) return;
    p.dx = dragging.dx + e.clientX - dragging.sx;
    p.dy = dragging.dy + e.clientY - dragging.sy;
    layout();
  });
  const end = () => { if (dragging && dragging.p === p) { p.el.classList.remove('drag'); dragging = null; } };
  p.el.addEventListener('pointerup', end);
  p.el.addEventListener('pointercancel', end);
}

function buttons() {
  $('undo').disabled = !pieces.length;
  $('clear').disabled = !pieces.length;
}
$('undo').onclick = () => { const p = pieces.pop(); if (p) p.el.remove(); redrawBase(); buttons(); };
$('clear').onclick = () => { pieces.forEach(p => p.el.remove()); pieces = []; redrawBase(); buttons(); say('Tap anything to cut it out.'); };
$('holes').onclick = () => { showHoles = !showHoles; $('holes').textContent = showHoles ? 'Holes on' : 'Holes off'; redrawBase(); };

load();
</script>
</body>
</html>
